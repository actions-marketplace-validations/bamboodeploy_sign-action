name: 'Bamboo Deploy Sign'
description: 'Scan and code-sign a Windows binary (.exe / .msi) via Bamboo Deploy. No certificate or HSM needed.'
author: 'Bamboo Deploy'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-key:
    description: 'Bamboo Deploy API key (starts with bd_live_). Store as a repo secret.'
    required: true
  file:
    description: 'Path to the .exe or .msi to sign'
    required: true
  output:
    description: 'Where to write the signed binary (default: replace the input file)'
    required: false
    default: ''
  poll-interval:
    description: 'Seconds between sign status polls'
    required: false
    default: '10'
  poll-timeout:
    description: 'Maximum seconds to wait for sign completion'
    required: false
    default: '900'
  cli-version:
    description: 'Tag or branch of github.com/bamboodeploy/cli to run'
    required: false
    default: 'v1.1.0'
  api-base:
    description: 'API base URL (override only if self-hosting)'
    required: false
    default: 'https://api.bamboodeploy.com'

outputs:
  app-id:
    description: 'The app id assigned by Bamboo Deploy'
    value: ${{ steps.run.outputs.app-id }}
  job-id:
    description: 'The sign job id'
    value: ${{ steps.run.outputs.job-id }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        BAMBOO_API_KEY: ${{ inputs.api-key }}
        BAMBOO_API_BASE: ${{ inputs.api-base }}
        INPUT_FILE: ${{ inputs.file }}
        OUTPUT_FILE: ${{ inputs.output }}
        POLL_INTERVAL: ${{ inputs.poll-interval }}
        POLL_TIMEOUT: ${{ inputs.poll-timeout }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        if [ -z "${BAMBOO_API_KEY:-}" ]; then echo "::error::api-key input is empty"; exit 1; fi
        if [ ! -f "$INPUT_FILE" ]; then echo "::error::input file not found: $INPUT_FILE"; exit 1; fi
        OUT_ARGS=()
        if [ -n "$OUTPUT_FILE" ]; then OUT_ARGS=(--out "$OUTPUT_FILE"); fi
        set +e
        RESULT=$(npx -y "github:bamboodeploy/cli#${CLI_VERSION}" sign "$INPUT_FILE" ${OUT_ARGS[@]+"${OUT_ARGS[@]}"} \
          --timeout "$POLL_TIMEOUT" --interval "$POLL_INTERVAL" --json)
        CODE=$?
        set -e
        echo "$RESULT"
        if [ "$CODE" -ne 0 ]; then
          MSG=$(printf '%s' "$RESULT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).message||s)}catch{console.log(s)}})')
          case "$CODE" in
            2) echo "::error::Signing requires a Premium subscription: https://www.bamboodeploy.com/dashboard/#billing" ;;
            3) echo "::error::Verify your publisher connections in the dashboard first: $MSG" ;;
            4) echo "::error::Timed out: $MSG. If the job is in operator review, re-run after approval or ask Bamboo to enable Auto-sign on your account." ;;
            *) echo "::error::$MSG" ;;
          esac
          exit "$CODE"
        fi
        printf '%s' "$RESULT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log("app-id="+r.app_id);console.log("job-id="+r.job_id)})' >> "$GITHUB_OUTPUT"
