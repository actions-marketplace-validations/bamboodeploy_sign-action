name: 'Bamboo Deploy Sign'
description: 'Scan and code-sign Windows binaries (.exe / .msi) via Bamboo Deploy.'
author: 'Bamboo Deploy'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-key:
    description: 'Bamboo Deploy API key (starts with bd_live_). Store as a repo secret.'
    required: true
  file:
    description: 'Path to the .exe or .msi to sign'
    required: false
    default: ''
  files:
    description: 'Several files to sign, one path per line. Wildcards such as dist/*.dll are allowed'
    required: false
    default: ''
  output:
    description: 'Where to write the signed binary (default: replace the input file). With several files, a folder'
    required: false
    default: ''
  poll-interval:
    description: 'Seconds between sign status polls'
    required: false
    default: '10'
  poll-timeout:
    description: 'Maximum seconds to wait for sign completion'
    required: false
    default: '900'
  cli-version:
    description: 'Tag or branch of github.com/bamboodeploy/cli to run'
    required: false
    default: 'v1.2.0'
  api-base:
    description: 'API base URL (override only if self-hosting)'
    required: false
    default: 'https://api.bamboodeploy.com'

outputs:
  app-id:
    description: 'The app id assigned by Bamboo Deploy (space separated when signing several files)'
    value: ${{ steps.run.outputs.app-id }}
  job-id:
    description: 'The sign job id (space separated when signing several files)'
    value: ${{ steps.run.outputs.job-id }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        BAMBOO_API_KEY: ${{ inputs.api-key }}
        BAMBOO_API_BASE: ${{ inputs.api-base }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_FILES: ${{ inputs.files }}
        OUTPUT_FILE: ${{ inputs.output }}
        POLL_INTERVAL: ${{ inputs.poll-interval }}
        POLL_TIMEOUT: ${{ inputs.poll-timeout }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        if [ -z "${BAMBOO_API_KEY:-}" ]; then echo "::error::api-key input is empty"; exit 1; fi
        FILES=()
        if [ -n "$INPUT_FILE" ]; then FILES+=("$INPUT_FILE"); fi
        while read -r line; do if [ -n "$line" ]; then FILES+=("$line"); fi; done <<< "$INPUT_FILES"
        if [ ${#FILES[@]} -eq 0 ]; then echo "::error::set the file or files input"; exit 1; fi
        OUT_ARGS=()
        if [ -n "$OUTPUT_FILE" ]; then OUT_ARGS=(--out "$OUTPUT_FILE"); fi
        set +e
        RESULT=$(npx -y "github:bamboodeploy/cli#${CLI_VERSION}" sign "${FILES[@]}" ${OUT_ARGS[@]+"${OUT_ARGS[@]}"} \
          --timeout "$POLL_TIMEOUT" --interval "$POLL_INTERVAL" --json)
        CODE=$?
        set -e
        echo "$RESULT"
        if [ "$CODE" -ne 0 ]; then
          MSG=$(printf '%s' "$RESULT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).message||s)}catch{console.log(s)}})')
          case "$CODE" in
            2) echo "::error::Signing requires a Premium subscription: https://www.bamboodeploy.com/dashboard/#billing" ;;
            3) echo "::error::Verify your publisher connections in the dashboard first: $MSG" ;;
            4) echo "::error::Timed out: $MSG. If the job is in operator review, re-run after approval." ;;
            *) echo "::error::$MSG" ;;
          esac
          exit "$CODE"
        fi
        printf '%s' "$RESULT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const f=JSON.parse(s).files;console.log("app-id="+f.map(x=>x.app_id).join(" "));console.log("job-id="+f.map(x=>x.job_id).join(" "))})' >> "$GITHUB_OUTPUT"
